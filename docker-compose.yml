version: '3.8'

services:
  # 백엔드 서비스 정의
  backend:
    build: ./backend  # ./backend 폴더의 Dockerfile을 사용해 이미지를 만듦
    ports:
      - "8000:8000"  # 내 컴퓨터의 8000번 포트와 컨테이너의 8000번 포트를 연결
    volumes:
      # [개발용 꿀팁] 내 컴퓨터의 소스 코드와 컨테이너 내부를 실시간으로 동기화
      # 이렇게 하면 코드를 수정할 때마다 Docker를 다시 빌드할 필요가 없음
      - ./backend/app:/app
    env_file:
      - ./.env  # 루트 폴더의 .env 파일에서 환경변수(API키 등)를 가져옴

  # 프론트엔드 서비스 정의
  frontend:
    build: ./frontend
    ports:
      - "3000:80"  # 내 컴퓨터의 3000번 포트와 컨테이너의 80번 포트(Nginx)를 연결
    volumes:
      - ./frontend/src:/app/src # [개발용 꿀팁] 프론트엔드 코드 실시간 동기화
    depends_on:
      - backend  # 백엔드 서비스가 먼저 실행된 후에 프론트엔드를 실행